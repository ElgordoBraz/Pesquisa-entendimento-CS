<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formuláre - Fluxo Único Contato</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --green-primary: #22C55E;
            --green-dark: #15803D;
            --blue-navy: #0D2240;
            --text-main: #0D0D0D;
            --text-sec: rgba(13, 13, 13, 0.7);
            --bg-color: #F5F3EE;
            --surface: #FFFFFF;
            --border-color: #E8E4DD;
            --badge-green-bg: rgba(34, 197, 94, 0.12);
            --shadow-soft: 0 10px 30px rgba(13, 34, 64, 0.05);
            --header-height: 80px;
            --red: #DC2626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Manrope', sans-serif; }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            overflow: hidden; display: flex; flex-direction: column; height: 100vh;
        }

        .header {
            height: var(--header-height);
            background-color: rgba(245, 243, 238, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px; z-index: 10;
        }

        .brand { display: flex; align-items: center; gap: 24px; }
        .brand-logo {
            display: flex; align-items: center; gap: 8px;
            font-family: 'Sora', sans-serif; font-weight: 800;
            color: var(--text-main); font-size: 18px;
            text-transform: uppercase; letter-spacing: -0.02em;
        }
        .brand-logo svg { width: 28px; height: 28px; }
        .header-titles {
            display: flex; flex-direction: column;
            border-left: 1px solid var(--border-color); padding-left: 24px;
        }
        .header-titles h1 {
            font-family: 'Sora', sans-serif; font-size: 16px;
            font-weight: 700; color: var(--text-main); margin-bottom: 2px;
        }
        .header-titles p { font-size: 13px; color: var(--text-sec); font-weight: 500; }

        .header-actions { display: flex; gap: 10px; align-items: center; }
        .pill-status {
            display: inline-flex; align-items: center; gap: 7px;
            font-size: 12px; font-weight: 600;
            padding: 7px 12px; border-radius: 999px;
            background: var(--surface); border: 1px solid var(--border-color);
            color: var(--text-sec);
        }
        .pill-status i { width: 8px; height: 8px; border-radius: 50%; background: #aaa; flex: none; }
        .pill-status.ok i { background: var(--green-primary); box-shadow: 0 0 0 0 rgba(34,197,94,.5); animation: pulse 2s infinite; }
        .pill-status.warn i { background: #F59E0B; }
        .pill-status.info i { background: #3B82F6; }
        .pill-status.load i { background: #3B82F6; animation: blink 1s infinite; }
        @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.4)} 70%{box-shadow:0 0 0 7px rgba(34,197,94,0)} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0)} }
        @keyframes blink { 50%{opacity:.3} }

        .btn-top {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 9px 15px; border-radius: 999px; font-weight: 600; font-size: 13px;
            border: 1px solid var(--border-color); background: var(--surface); color: var(--blue-navy);
            cursor: pointer; transition: all .2s;
        }
        .btn-top:hover { background: var(--bg-color); border-color: var(--blue-navy); }
        .btn-top.primary { background: var(--green-primary); color: white; border-color: var(--green-primary); }
        .btn-top.primary:hover { background: var(--green-dark); border-color: var(--green-dark); }
        .btn-top:disabled { opacity: .6; cursor: wait; }
        .dirty-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: blink 1.1s infinite; }
        .spin { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: rot .7s linear infinite; }
        .spin.dark { border-color: rgba(13,34,64,.25); border-top-color: var(--blue-navy); }
        @keyframes rot { to { transform: rotate(360deg); } }

        #map-wrapper {
            flex: 1; position: relative; background-color: var(--bg-color);
            overflow: hidden;
            background-image: radial-gradient(var(--border-color) 1.5px, transparent 0);
            background-size: 32px 32px; cursor: grab;
        }
        #map-wrapper:active { cursor: grabbing; }

        #canvas { position: absolute; width: 6500px; height: 3000px; transform-origin: 0 0; }
        #lines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .node {
            position: absolute; width: 300px; padding: 24px;
            border-radius: 16px; background: var(--surface);
            box-shadow: var(--shadow-soft); border: 1px solid var(--border-color);
            font-size: 14px; line-height: 1.6; color: var(--text-main);
            cursor: grab; user-select: none; transition: box-shadow 0.2s; z-index: 2;
        }
        .node:hover { box-shadow: 0 25px 70px rgba(13,34,64,0.12); }
        .node.dragging { cursor: grabbing; z-index: 10; }
        .node.resizing { cursor: nwse-resize; }

        .node-header { background-color: var(--blue-navy); color: var(--surface); border: none; text-align: center; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px; }
        .node-message { background-color: var(--badge-green-bg); border-left: 4px solid var(--green-primary); }
        .node-summary { background-color: var(--bg-color); border-left: 4px solid var(--blue-navy); }
        .node-condition { background-color: var(--surface); border: 2px solid var(--blue-navy); border-radius: 999px; font-family: 'Sora', sans-serif; font-weight: 700; text-align: center; padding: 16px 24px; display: flex; align-items: center; justify-content: center; }
        .node-system { background-color: var(--blue-navy); color: var(--surface); font-size: 13px; text-align: center; }
        .node-action { background-color: var(--surface); border-left: 4px solid var(--text-main); }
        .node-info { background-color: var(--bg-color); border: 1px dashed rgba(13, 34, 64, 0.2); color: var(--text-sec); }
        .node-process { background-color: var(--surface); border-left: 4px solid var(--green-primary); font-weight: 600; }

        .resize-handle {
            position: absolute;
            right: 4px; bottom: 4px;
            width: 18px; height: 18px;
            cursor: nwse-resize;
            opacity: 0;
            transition: opacity .2s;
            z-index: 5;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-sec);
            font-size: 11px;
        }
        .node:hover .resize-handle { opacity: 0.6; }
        .resize-handle:hover { opacity: 1 !important; color: var(--blue-navy); }

        .node-delete {
            position: absolute;
            top: 8px; right: 8px;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--border-color);
            color: var(--text-sec);
            display: none;
            align-items: center; justify-content: center;
            cursor: pointer;
            transition: all .2s;
            z-index: 5;
            font-size: 14px;
        }
        .node:hover .node-delete { display: flex; }
        .node-delete:hover {
            background: var(--red);
            color: white;
            border-color: var(--red);
            transform: scale(1.1);
        }

        .anchor {
            position: absolute;
            width: 16px; height: 16px;
            border-radius: 50%;
            background: var(--surface);
            border: 2px solid var(--green-primary);
            cursor: crosshair;
            opacity: 0;
            transition: all .2s;
            z-index: 6;
        }
        .node:hover .anchor { opacity: 1; }
        .anchor:hover {
            background: var(--green-primary);
            transform: scale(1.3);
        }
        .anchor.in {
            top: -8px; left: 50%; transform: translateX(-50%);
        }
        .anchor.in:hover { transform: translateX(-50%) scale(1.3); }
        .anchor.out {
            bottom: -8px; left: 50%; transform: translateX(-50%);
        }
        .anchor.out:hover { transform: translateX(-50%) scale(1.3); }

        .zoom-hint {
            margin-top: 16px; font-size: 12px; color: var(--green-dark);
            font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
            cursor: pointer; padding: 6px 12px;
            background-color: rgba(34, 197, 94, 0.1); border-radius: 999px;
        }
        .node-summary .zoom-hint { color: var(--blue-navy); background-color: rgba(13, 34, 64, 0.05); }
        .node-system .zoom-hint { color: var(--surface); background-color: rgba(255, 255, 255, 0.15); }
        .node-header .zoom-hint { color: var(--surface); background-color: rgba(255,255,255,0.15); }

        #lines .line-hit {
            stroke: transparent;
            stroke-width: 18;
            fill: none;
            pointer-events: stroke;
            cursor: pointer;
        }
        #lines .line-vis {
            pointer-events: none;
            transition: stroke .2s, stroke-width .2s;
        }
        #lines .line-hit:hover + .line-vis,
        #lines .line-vis.hover {
            stroke: var(--red);
            stroke-width: 3;
        }

        .disconnect-btn {
            position: absolute;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--red);
            color: white;
            border: 2px solid white;
            display: none;
            align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 12px;
            z-index: 4;
            box-shadow: 0 4px 12px rgba(220,38,38,.4);
            transform: translate(-50%, -50%);
            pointer-events: auto;
        }
        .disconnect-btn:hover { background: #991B1B; transform: translate(-50%, -50%) scale(1.15); }

        .map-controls {
            position: absolute; bottom: 32px; left: 32px;
            display: flex; flex-direction: column; gap: 12px; z-index: 20;
        }
        .btn-control {
            background-color: var(--surface); border: 1px solid var(--border-color);
            width: 48px; height: 48px; border-radius: 999px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 8px 24px rgba(13,34,64,0.06);
            color: var(--blue-navy); transition: all 0.2s; font-size: 18px;
        }
        .btn-control:hover {
            background-color: var(--green-primary); border-color: var(--green-primary); color: var(--surface);
        }

        .btn-fab {
            position: absolute; bottom: 32px; right: 32px; z-index: 20;
            background: var(--green-primary); color: white;
            border: none; border-radius: 999px;
            padding: 14px 22px; font-size: 14px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; box-shadow: 0 12px 30px rgba(34,197,94,.35);
            transition: all .2s;
        }
        .btn-fab:hover { background: var(--green-dark); transform: translateY(-2px); }

        .ctx-menu {
            position: fixed;
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 20px 40px rgba(13,34,64,.2);
            z-index: 300;
            min-width: 200px;
            display: none;
        }
        .ctx-menu.show { display: block; animation: ctxIn .15s ease-out; }
        @keyframes ctxIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .ctx-menu button {
            display: flex; align-items: center; gap: 10px;
            width: 100%;
            padding: 9px 12px;
            border: none; background: transparent;
            border-radius: 8px;
            font-size: 13px; font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            font-family: 'Manrope';
        }
        .ctx-menu button:hover { background: var(--bg-color); }
        .ctx-menu button.danger { color: var(--red); }
        .ctx-menu button.danger:hover { background: #FEF2F2; }
        .ctx-menu .sep {
            height: 1px; background: var(--border-color);
            margin: 6px 4px;
        }
        .ctx-menu .ctx-title {
            padding: 6px 12px 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text-sec);
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(5, 9, 17, 0.4); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 100;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            background-color: var(--surface); width: 90%; max-width: 700px;
            border-radius: 24px; box-shadow: 0 40px 80px rgba(13,34,64,0.15);
            padding: 40px; position: relative;
            transform: translateY(20px) scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--border-color);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); }

        .modal-close {
            position: absolute; top: 24px; right: 24px;
            background: var(--bg-color); border: 1px solid var(--border-color);
            width: 40px; height: 40px; border-radius: 999px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: var(--text-sec); cursor: pointer; transition: all 0.2s;
        }
        .modal-close:hover { background: var(--surface); color: var(--text-main); border-color: var(--text-main); }

        .modal-header { margin-bottom: 24px; }
        .modal-header h2 {
            font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 800;
            color: var(--text-main); margin-bottom: 4px; letter-spacing: -0.02em;
        }

        .field-group { margin-bottom: 18px; }
        .field-group label {
            display: block; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .08em;
            color: var(--text-sec); margin-bottom: 6px;
        }
        .field-group input, .field-group textarea, .field-group select {
            width: 100%; padding: 12px 14px; font-size: 14px;
            border: 1px solid var(--border-color); border-radius: 12px;
            background: var(--bg-color); color: var(--text-main);
            outline: none; transition: .2s; font-family: 'Manrope';
        }
        .field-group input:focus, .field-group textarea:focus, .field-group select:focus {
            border-color: var(--green-primary); background: var(--surface);
            box-shadow: 0 0 0 3px rgba(34,197,94,.12);
        }
        .field-group textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
        .modal-actions button {
            padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 13px;
            cursor: pointer; border: 1px solid var(--border-color);
            background: var(--surface); color: var(--text-main); transition: .2s; font-family: 'Manrope';
        }
        .modal-actions button:hover { background: var(--bg-color); }
        .modal-actions .primary { background: var(--green-primary); color: white; border-color: var(--green-primary); }
        .modal-actions .primary:hover { background: var(--green-dark); }
        .modal-actions .danger { color: var(--red); border-color: #FCA5A5; margin-right: auto; }
        .modal-actions .danger:hover { background: #FEF2F2; border-color: var(--red); }

        .hint-box {
            background: #EFF6FF; border: 1px solid #BFDBFE; color: #1E40AF;
            padding: 10px 12px; border-radius: 10px; font-size: 12px;
            line-height: 1.55; margin-bottom: 16px;
        }
        .warn-box {
            background: #FFF8E1; border: 1px solid #F59E0B; color: #78350F;
            padding: 12px 14px; border-radius: 10px; font-size: 13px;
            line-height: 1.55; margin-bottom: 16px;
        }
        .ok-box {
            background: #ECFDF5; border: 1px solid #6EE7B7; color: #065F46;
            padding: 12px 14px; border-radius: 10px; font-size: 13px;
            line-height: 1.55; margin-top: 12px;
        }

        #toast {
            position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 120%);
            background: var(--blue-navy); color: white; padding: 13px 22px;
            border-radius: 10px; font-size: 13.5px; font-weight: 600;
            box-shadow: 0 20px 40px rgba(13,34,64,.25); z-index: 200;
            transition: transform .35s cubic-bezier(.2,.9,.3,1.2); max-width: 90vw;
        }
        #toast.show { transform: translate(-50%, 0); }
        #toast.erro { background: #B91C1C; }
        #toast.aviso { background: #92400E; }
    </style>
</head>
<body>

    <header class="header">
        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="6"/>
                    <circle cx="12" cy="12" r="2"/>
                </svg>
                GRUPO ÚNICO CONTATO
            </div>
            <div class="header-titles">
                <h1>Automação Comercial + IA Conversacional</h1>
                <p>Mapeamento Lógico: Reativação e Pós-Venda</p>
            </div>
        </div>

        <div class="header-actions">
            <span id="statusPill" class="pill-status info"><i></i><span id="statusTxt">Carregando…</span></span>
            <button class="btn-top primary" id="btnPDF" onclick="saveAsPDF()">
                <i class="bi bi-file-earmark-pdf"></i>
                <span>Salvar em PDF</span>
            </button>
            <button class="btn-top" onclick="openConfigModal()"><i class="bi bi-github"></i> GitHub</button>
            <button class="btn-top primary" id="btnSave" onclick="saveToGitHub()">
                <span id="saveSpin" class="spin" style="display:none"></span>
                <i class="bi bi-cloud-arrow-up" id="saveIcon"></i>
                <span id="saveLabel">Salvar e publicar</span>
                <span id="dirtyDot" class="dirty-dot" style="display:none"></span>
            </button>
        </div>
    </header>

    <div id="map-wrapper">
        <div id="canvas">
            <svg id="lines">
                <defs>
                    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(13, 34, 64, 0.3)" />
                    </marker>
                    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626" />
                    </marker>
                </defs>
            </svg>
        </div>
    </div>

    <div class="map-controls">
        <button class="btn-control" id="btn-zoom-in" title="Zoom In"><i class="bi bi-plus-lg"></i></button>
        <button class="btn-control" id="btn-zoom-out" title="Zoom Out"><i class="bi bi-dash-lg"></i></button>
        <button class="btn-control" id="btn-center" title="Centralizar Fluxo"><i class="bi bi-bullseye"></i></button>
    </div>

    <button class="btn-fab" onclick="addNewNode()"><i class="bi bi-plus-lg"></i> Criar novo card</button>

    <div id="ctx-menu" class="ctx-menu"></div>

    <div class="modal-overlay" id="node-modal">
        <div class="modal-box">
            <button class="modal-close" id="btn-close-modal"><i class="bi bi-x-lg"></i></button>
            <div class="modal-header">
                <h2 id="modal-title">Editar card</h2>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <div class="modal-overlay" id="cfg-modal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal('cfg-modal')"><i class="bi bi-x-lg"></i></button>
            <div class="modal-header">
                <h2><i class="bi bi-github"></i> Conexão com o GitHub</h2>
            </div>
            <div class="warn-box">
                ⚠️ O token fica salvo <b>apenas no seu navegador</b>. Use um token <b>fine-grained</b> com acesso só a este repositório e permissão <b>Contents: Read &amp; Write</b>.
            </div>
            <div class="field-group"><label>Usuário / Organização</label><input id="cfgOwner" placeholder="ex: grupo-unicocontato"></div>
            <div class="field-group"><label>Repositório</label><input id="cfgRepo" placeholder="ex: fluxo-crm"></div>
            <div class="field-row">
                <div class="field-group"><label>Branch</label><input id="cfgBranch" placeholder="main" value="main"></div>
                <div class="field-group"><label>Arquivo</label><input id="cfgPath" placeholder="dados.json" value="dados.json"></div>
            </div>
            <div class="field-group"><label>Token (fine-grained PAT)</label><input id="cfgToken" type="password" placeholder="github_pat_..."></div>
            <div id="cfgResult"></div>
            <div class="modal-actions">
                <button onclick="testConnection()">Testar conexão</button>
                <button class="primary" onclick="saveConfig()">Salvar configuração</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const DEFAULT_NODES = [
            { id: "leg_title", label: "REGRAS E PAPÉIS\nÚnico Contato", type: "header", x: 50, y: 50 },
            { id: "leg_sys", label: "⚙️ AUTOMAÇÃO / SISTEMA\nResponsável por:\n• Controlar a sequência temporal\n• Disparar mensagens e templates", type: "system", x: 50, y: 150 },
            { id: "leg_ia", label: "🤖 IA CONVERSACIONAL\nResponsável EXCLUSIVAMENTE por:\n• Interpretar a mensagem do cliente\n• Conversar e tirar dúvidas da base\n• Conduzir a conversa", type: "message", x: 50, y: 350 },

        function encodeB64(str) {
            const b = new TextEncoder().encode(str);
            let s = ''; b.forEach(x => s += String.fromCharCode(x));
            return btoa(s);
        }
        function decodeB64(b64) {
            return new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));
        }
        const apiUrl = () => `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}?ref=${cfg.branch}`;

        async function loadFromGitHub() {
            setStatus('load', 'Carregando…');
            if (cfg.owner && cfg.repo && cfg.token) {
                try {
                    const r = await fetch(apiUrl(), { headers: { 'Accept': 'application/vnd.github+json', 'Cache-Control': 'no-cache' } });
                    if (r.ok) {
                        const j = await r.json();
                        const data = JSON.parse(decodeB64(j.content));
                        nodesData = data.nodesData || [];
                        connections = data.connections || [];
                        localStorage.setItem(LS_CACHE, JSON.stringify({ nodesData, connections }));
                        setStatus('ok', 'Sincronizado · GitHub');
                        renderAll(); return;
                    }
                    if (r.status === 404) setStatus('warn', 'Conectado · aguardando 1ª publicação');
                    else setStatus('warn', 'GitHub respondeu ' + r.status);
                } catch (e) { setStatus('warn', 'Sem conexão com o repositório'); }
            }
            const cached = localStorage.getItem(LS_CACHE);
            if (cached) {
                const data = JSON.parse(cached);

                connections = data.connections || [];

                nodesData = JSON.parse(JSON.stringify(DEFAULT_NODES));

                div.addEventListener('click', (e) => {
                    if (hasDragged) { hasDragged = false; return; }
                    if (e.target.closest('.node-delete') || e.target.closest('.anchor') || e.target.closest('.resize-handle')) return;
                    openEditModal(n);
                });

                div.querySelector('.node-delete').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm(`Excluir o card "${n.label.split('\n')[0]}" e suas conexões?`)) {
                        deleteNode(n.id);
                    }
                });

                const resizeHandle = div.querySelector('.resize-handle');
                resizeHandle.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    startResize(n, div, e);
                });

                const anchorOut = div.querySelector('.anchor.out');
                anchorOut.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    startConnection(n.id, e);
                });

                const finishConn = (e) => {
                    if (connecting && connecting.fromId !== n.id) {
                        e.stopPropagation();
                        finishConnection(n.id);
                    }
                };
                div.querySelector('.anchor.in').addEventListener('pointerup', finishConn);
                div.addEventListener('pointerup', finishConn);

                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    showNodeContextMenu(e, n);
                });

                canvas.appendChild(div);
            });

            d3.selectAll('.node').call(d3.drag()
                .on('start', function () {
                    if (connecting || resizing) return;
                    hasDragged = false;
                    d3.select(this).raise().classed('dragging', true);
                })
                .on('drag', function (event) {
                    if (connecting || resizing) return;
                    hasDragged = true;
                    const node = d3.select(this);
                    const currentLeft = parseFloat(node.style('left')) || 0;
                    const currentTop = parseFloat(node.style('top')) || 0;
                    node.style('left', (currentLeft + event.dx) + 'px');
                    node.style('top', (currentTop + event.dy) + 'px');
                    const id = node.attr('id');
                    const ref = nodesData.find(x => x.id === id);
                    if (ref) { ref.x = currentLeft + event.dx; ref.y = currentTop + event.dy; }
                    drawLines();
                })
                .on('end', function () {
                    if (connecting || resizing) return;
                    d3.select(this).classed('dragging', false);
                    if (hasDragged) markDirty();
                })
            );
        }

        function drawLines() {
            const svg = document.getElementById('lines');
            [...svg.querySelectorAll('path, g.line-group')].forEach(p => p.remove());

            connections.forEach((conn, idx) => {
                const fromNode = document.getElementById(conn.from);
                const toNode = document.getElementById(conn.to);
                if (!fromNode || !toNode) return;

                const pathData = calcPath(fromNode, toNode);
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('class', 'line-group');
                g.dataset.from = conn.from;
                g.dataset.to = conn.to;

                const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                hit.setAttribute('class', 'line-hit');
                hit.setAttribute('d', pathData);

                const vis = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                vis.setAttribute('class', 'line-vis');
                vis.setAttribute('d', pathData);
                vis.setAttribute('stroke', 'rgba(13, 34, 64, 0.3)');
                vis.setAttribute('stroke-width', '2');
                vis.setAttribute('fill', 'none');
                vis.setAttribute('marker-end', 'url(#arrow)');

                g.appendChild(hit);
                g.appendChild(vis);
                svg.appendChild(g);

                hit.addEventListener('mouseenter', (e) => showDisconnectButton(e, conn, vis));
                hit.addEventListener('mousemove', (e) => moveDisconnectButton(e));
                hit.addEventListener('mouseleave', () => scheduleHideDisconnect());
                
                hit.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    showLineContextMenu(e, conn);
                });
            });
        }

        function calcPath(fromNode, toNode) {
            const x1 = fromNode.offsetLeft + fromNode.offsetWidth / 2;
            const y1 = fromNode.offsetTop + fromNode.offsetHeight;
            const x2 = toNode.offsetLeft + toNode.offsetWidth / 2;
            const y2 = toNode.offsetTop;

            if (toNode.offsetLeft > fromNode.offsetLeft + 100 && y2 > y1 - 100 && y2 < y1 + 100) {
                const rx1 = fromNode.offsetLeft + fromNode.offsetWidth;
                const ry1 = fromNode.offsetTop + fromNode.offsetHeight / 2;
                const lx2 = toNode.offsetLeft;
                const ly2 = toNode.offsetTop + toNode.offsetHeight / 2;
                return `M ${rx1} ${ry1} L ${lx2} ${ly2}`;
            } else if (y2 >= y1) {
                const midY = y1 + (y2 - y1) / 2;
                return `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
            } else {
                return `M ${x1} ${y1} C ${x1} ${y1 + 40}, ${x2} ${y2 - 40}, ${x2} ${y2}`;
            }
        }

        let connecting = null;
        let tempLine = null;

        function startConnection(fromId, event) {
            connecting = { fromId };
            const svg = document.getElementById('lines');
            tempLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            tempLine.setAttribute('stroke', 'rgba(34, 197, 94, 0.8)');
            tempLine.setAttribute('stroke-width', '3');
            tempLine.setAttribute('stroke-dasharray', '6 4');
            tempLine.setAttribute('fill', 'none');
            tempLine.setAttribute('marker-end', 'url(#arrow)');
            svg.appendChild(tempLine);

            connecting.start = getCanvasPoint(event);

            document.addEventListener('pointermove', onConnectMove);
            document.addEventListener('pointerup', onConnectEnd);
        }

        function onConnectMove(e) {
            if (!connecting || !tempLine) return;
            const current = getCanvasPoint(e);
            const s = connecting.start;
            const midY = s.y + (current.y - s.y) / 2;
            tempLine.setAttribute('d', `M ${s.x} ${s.y} C ${s.x} ${midY}, ${current.x} ${midY}, ${current.x} ${current.y}`);
        }

        function onConnectEnd(e) {
            document.removeEventListener('pointermove', onConnectMove);
            document.removeEventListener('pointerup', onConnectEnd);
            if (tempLine) { tempLine.remove(); tempLine = null; }
            connecting = null;
        }

        function finishConnection(toId) {
            if (!connecting) return;
            const fromId = connecting.fromId;
            if (fromId === toId) return;
            if (!connections.some(c => c.from === fromId && c.to === toId)) {
                connections.push({ from: fromId, to: toId });
                markDirty();
                drawLines();
                toast('Conexão criada — lembre de "Salvar e publicar".');
            }
            document.removeEventListener('pointermove', onConnectMove);
            document.removeEventListener('pointerup', onConnectEnd);
            if (tempLine) { tempLine.remove(); tempLine = null; }
            connecting = null;
        }

        function getCanvasPoint(e) {
            const t = d3.zoomTransform(mapWrapper);
            const wrapRect = mapWrapper.getBoundingClientRect();
            const x = (e.clientX - wrapRect.left - t.x) / t.k;
            const y = (e.clientY - wrapRect.top - t.y) / t.k;
            return { x, y };
        }

        let disconnectBtn = null;
        let currentDisconnect = null;
        let hideTimer = null;

        function ensureDisconnectBtn() {
            if (!disconnectBtn) {
                disconnectBtn = document.createElement('button');
                disconnectBtn.className = 'disconnect-btn';
                disconnectBtn.innerHTML = '<i class="bi bi-x"></i>';
                disconnectBtn.title = 'Remover conexão';
                disconnectBtn.addEventListener('mouseenter', () => {
                    clearTimeout(hideTimer);
                });
                disconnectBtn.addEventListener('mouseleave', () => {
                    scheduleHideDisconnect();
                });
                canvas.appendChild(disconnectBtn);
            }
            return disconnectBtn;
        }

        function showDisconnectButton(e, conn, visPath) {
            clearTimeout(hideTimer);
            const btn = ensureDisconnectBtn();
            currentDisconnect = { conn, visPath };
            btn.onclick = (ev) => {
                ev.stopPropagation();
                if (confirm(`Remover conexão ${conn.from} → ${conn.to}?`)) {
                    connections = connections.filter(c => !(c.from === conn.from && c.to === conn.to));
                    markDirty();
                    hideDisconnectButton();
                    drawLines();
                    toast('Conexão removida.');
                }
            };
            btn.style.display = 'flex';
            moveDisconnectButton(e);
        }

        function moveDisconnectButton(e) {
            if (!disconnectBtn) return;
            const point = getCanvasPoint(e);
            disconnectBtn.style.left = point.x + 'px';
            disconnectBtn.style.top = point.y + 'px';
        }

        function scheduleHideDisconnect() {
            clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                if (disconnectBtn) disconnectBtn.style.display = 'none';
                currentDisconnect = null;
            }, 200);
        }

        function hideDisconnectButton() {
            clearTimeout(hideTimer);
            if (disconnectBtn) disconnectBtn.style.display = 'none';
            currentDisconnect = null;
        }

        let resizing = null;

        function startResize(node, div, event) {
            resizing = { node, div, startX: event.clientX, startWidth: div.offsetWidth };
            div.classList.add('resizing');
            document.addEventListener('pointermove', onResizeMove);
            document.addEventListener('pointerup', onResizeEnd);
        }

        function onResizeMove(e) {
            if (!resizing) return;
            const t = d3.zoomTransform(mapWrapper);
            const dx = (e.clientX - resizing.startX) / t.k;
            const newWidth = Math.max(180, Math.min(800, resizing.startWidth + dx));
            resizing.div.style.width = newWidth + 'px';
            drawLines();
        }

        function onResizeEnd(e) {
            if (!resizing) return;
            resizing.node.width = resizing.div.offsetWidth;
            resizing.div.classList.remove('resizing');
            document.removeEventListener('pointermove', onResizeMove);
            document.removeEventListener('pointerup', onResizeEnd);
            markDirty();
            resizing = null;
        }

        function deleteNode(id) {
            nodesData = nodesData.filter(n => n.id !== id);
            connections = connections.filter(c => c.from !== id && c.to !== id);
            markDirty();
            renderAll();
            hideContextMenu();
            toast('Card excluído.');
        }

        function duplicateNode(node) {
            const newId = 'n_' + Date.now().toString(36);
            const copy = {
                id: newId,
                label: node.label + ' (cópia)',
                type: node.type,
                x: node.x + 40,
                y: node.y + 40
            };
            if (node.width) copy.width = node.width;
            nodesData.push(copy);
            markDirty();
            renderAll();
            hideContextMenu();
            toast('Card duplicado.');
        }

        function showNodeContextMenu(e, node) {
            const items = [
                { icon: 'bi-pencil', label: 'Editar card', action: () => { openEditModal(node); hideContextMenu(); } },
                { icon: 'bi-copy', label: 'Duplicar', action: () => duplicateNode(node) },
                { icon: 'bi-arrows-angle-expand', label: 'Redimensionar (arraste o canto)', action: () => { toast('Arraste o ícone no canto inferior direito do card'); hideContextMenu(); } },
                { sep: true },
                { icon: 'bi-trash', label: 'Excluir card', danger: true, action: () => {

                }}
            ];

        }

        function showLineContextMenu(e, conn) {
            const items = [
                { icon: 'bi-link-45deg', label: `Desconectar ${conn.from} → ${conn.to}`, danger: true, action: () => {
                    connections = connections.filter(c => !(c.from === conn.from && c.to === conn.to));
                    markDirty();
                    drawLines();
                    hideContextMenu();
                    toast('Conexão removida.');
                }}
            ];
            renderContextMenu(e.clientX, e.clientY, items);
        }

        function showCanvasContextMenu(e) {
            const point = getCanvasPoint(e);
            const items = [
                { icon: 'bi-plus-lg', label: 'Criar novo card aqui', action: () => {
                    addNewNodeAt(point.x, point.y);
                    hideContextMenu();
                }},
                { icon: 'bi-bullseye', label: 'Centralizar fluxo', action: () => { centerMap(); hideContextMenu(); }},
                { icon: 'bi-file-earmark-pdf', label: 'Salvar em PDF', action: () => { saveAsPDF(); hideContextMenu(); }},
                { sep: true },
                { icon: 'bi-cloud-arrow-up', label: 'Salvar e publicar', action: () => { saveToGitHub(); hideContextMenu(); }}
            ];
            renderContextMenu(e.clientX, e.clientY, items);
        }

        function renderContextMenu(x, y, items) {
            ctxMenu.innerHTML = '';
            items.forEach(item => {
                if (item.sep) {
                    const s = document.createElement('div');
                    s.className = 'sep';
                    ctxMenu.appendChild(s);
                    return;
                }
                const b = document.createElement('button');
                b.innerHTML = `<i class="bi ${item.icon}"></i><span>${item.label}</span>`;
                if (item.danger) b.classList.add('danger');
                b.onclick = item.action;
                ctxMenu.appendChild(b);
            });

            ctxMenu.style.left = x + 'px';
            ctxMenu.style.top = y + 'px';
            ctxMenu.classList.add('show');

            requestAnimationFrame(() => {
                const rect = ctxMenu.getBoundingClientRect();
                if (rect.right > window.innerWidth) {
                    ctxMenu.style.left = (x - rect.width) + 'px';
                }
                if (rect.bottom > window.innerHeight) {
                    ctxMenu.style.top = (y - rect.height) + 'px';
                }
            });
        }

        function hideContextMenu() {
            ctxMenu.classList.remove('show');
        }

        document.addEventListener('click', (e) => {
            if (!ctxMenu.contains(e.target)) hideContextMenu();
        });
        document.addEventListener('contextmenu', (e) => {
            if (e.target.id === 'canvas' || e.target.id === 'lines' || e.target.closest('#map-wrapper') && !e.target.closest('.node') && !e.target.closest('.line-hit')) {
                e.preventDefault();
                showCanvasContextMenu(e);
            } else {
                hideContextMenu();
            }
        });

        function addNewNode() {

            const rect = wrap.getBoundingClientRect();

            const cx = (rect.width / 2 - t.x) / t.k;
            const cy = (rect.height / 2 - t.y) / t.k;
            addNewNodeAt(cx, cy);
        }

        const zoom = d3.zoom().scaleExtent([0.1, 2]).on("zoom", (event) => {
            d3.select("#canvas").style("transform", `translate(${event.transform.x}px, ${event.transform.y}px) scale(${event.transform.k})`);
        });
        d3.select("#map-wrapper").call(zoom);

        function centerMap() {
            const initialScale = 0.4;
            d3.select("#map-wrapper").transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(300, 50).scale(initialScale));
        }

        document.getElementById('btn-zoom-in').addEventListener('click', () => { d3.select("#map-wrapper").transition().duration(300).call(zoom.scaleBy, 1.3); });
        document.getElementById('btn-zoom-out').addEventListener('click', () => { d3.select("#map-wrapper").transition().duration(300).call(zoom.scaleBy, 0.7); });
        document.getElementById('btn-center').addEventListener('click', centerMap);

        function openConfigModal() {
            document.getElementById('cfgOwner').value = cfg.owner;
            document.getElementById('cfgRepo').value = cfg.repo;
            document.getElementById('cfgBranch').value = cfg.branch || 'main';
            document.getElementById('cfgPath').value = cfg.path || 'dados.json';
            document.getElementById('cfgToken').value = cfg.token;
            document.getElementById('cfgResult').innerHTML = '';
            document.getElementById('cfg-modal').classList.add('active');
        }
        function readConfigFields() {
            return {
                owner: document.getElementById('cfgOwner').value.trim(),
                repo: document.getElementById('cfgRepo').value.trim(),
                branch: document.getElementById('cfgBranch').value.trim() || 'main',
                path: document.getElementById('cfgPath').value.trim() || 'dados.json',
                token: document.getElementById('cfgToken').value.trim()
            };
        }
        async function testConnection() {
            const c = readConfigFields();
            const box = document.getElementById('cfgResult');
            box.innerHTML = '<div class="warn-box">Testando…</div>';
            if (!c.owner || !c.repo) { box.innerHTML = '<div class="warn-box">Preencha usuário e repositório.</div>'; return; }
            try {
                const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}`, {
                    headers: { 'Accept': 'application/vnd.github+json', ...(c.token ? { Authorization: 'Bearer ' + c.token } : {}) }
                });
                if (r.ok) box.innerHTML = '<div class="ok-box">✅ Repositório acessível. Conexão OK!</div>';
                else if (r.status === 404) box.innerHTML = '<div class="warn-box">❌ Repositório não encontrado (ou o token não tem acesso).</div>';
                else box.innerHTML = `<div class="warn-box">❌ Erro HTTP ${r.status}${r.status === 401 ? ' — token inválido.' : ''}.</div>`;
            } catch (e) { box.innerHTML = '<div class="warn-box">❌ Falha de rede: ' + e.message + '</div>'; }
        }
        function saveConfig() {
            cfg = readConfigFields();
            localStorage.setItem(LS_CFG, JSON.stringify(cfg));
            closeModal('cfg-modal');
            toast('Configuração salva! Recarregando dados…');
            loadFromGitHub();
        }

        async function saveToGitHub() {
            if (!cfg.owner || !cfg.repo || !cfg.token) {
                toast('⚠️ Configure o GitHub primeiro.', 'aviso');
                openConfigModal(); return;
            }
            const btn = document.getElementById('btnSave');
            btn.disabled = true;
            document.getElementById('saveSpin').style.display = 'inline-block';
            document.getElementById('saveIcon').style.display = 'none';
            document.getElementById('saveLabel').textContent = 'Publicando…';
            const payload = JSON.stringify({ nodesData, connections, atualizadoEm: new Date().toISOString() }, null, 2);
            try {
                let sha = null;
                const g = await fetch(apiUrl(), { headers: auth() });
                if (g.ok) sha = (await g.json()).sha;
                else if (g.status !== 404) throw new Error('HTTP ' + g.status + ' ao ler arquivo');
                const body = {
                    message: '✏️ Fluxo atualizado — ' + new Date().toLocaleString('pt-BR'),
                    content: encodeB64(payload),
                    branch: cfg.branch || 'main'
                };
                if (sha) body.sha = sha;
                const p = await fetch(apiUrl(), {
                    method: 'PUT',
                    headers: { ...auth(), 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!p.ok) {
                    const e = await p.json().catch(() => ({}));
                    throw new Error(e.message || 'HTTP ' + p.status);
                }
                localStorage.setItem(LS_CACHE, JSON.stringify({ nodesData, connections }));
                dirty = false;
                document.getElementById('dirtyDot').style.display = 'none';
                setStatus('ok', 'Publicado · GitHub');
                document.getElementById('saveLabel').textContent = '✓ Publicado!';
                toast('✅ Publicado! Quem acessar o site verá as alterações.');
                setTimeout(() => { document.getElementById('saveLabel').textContent = 'Salvar e publicar'; }, 2200);
            } catch (err) {
                toast('❌ Erro: ' + err.message, 'erro');
            } finally {
                btn.disabled = false;
                document.getElementById('saveSpin').style.display = 'none';
                document.getElementById('saveIcon').style.display = 'inline-block';
                if (document.getElementById('saveLabel').textContent === 'Publicando…') {
                    document.getElementById('saveLabel').textContent = 'Salvar e publicar';
                }
            }
        }

        /* ===== SALVAR EM PDF (ALTA RESOLUÇÃO) ===== */
        async function saveAsPDF() {
            const btn = document.getElementById('btnPDF');
            const orig = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spin dark"></span> Gerando PDF…';

            const savedTransform = d3.zoomTransform(mapWrapper);
            const origOverflow = mapWrapper.style.overflow;
            const hiddenEls = [];

            try {
                if (document.fonts) await document.fonts.ready;

                // 1) Reseta o zoom para 1:1 e libera overflow
                d3.select("#map-wrapper").call(zoom.transform, d3.zoomIdentity);
                mapWrapper.style.overflow = 'visible';
                await new Promise(r => setTimeout(r, 250));

                // 2) Bounding box dos cards
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                nodesData.forEach(n => {
                    const el = document.getElementById(n.id);
                    if (!el) return;
                    minX = Math.min(minX, el.offsetLeft);
                    minY = Math.min(minY, el.offsetTop);
                    maxX = Math.max(maxX, el.offsetLeft + el.offsetWidth);
                    maxY = Math.max(maxY, el.offsetTop + el.offsetHeight);
                });
                if (!isFinite(minX)) throw new Error('Nenhum card encontrado para exportar.');

                const pad = 60;
                minX = Math.max(0, minX - pad);
                minY = Math.max(0, minY - pad);
                maxX += pad; maxY += pad;

                const W = Math.ceil(maxX - minX);
                const H = Math.ceil(maxY - minY);

                // 3) Esconde UI que não deve ir para o PDF
                ['.zoom-hint', '.node-delete', '.anchor', '.resize-handle',
                 '.disconnect-btn', '#dirtyDot'].forEach(sel => {
                    document.querySelectorAll(sel).forEach(el => {
                        hiddenEls.push([el, el.style.display]);
                        el.style.display = 'none';
                    });
                });

                // 4) Scale conforme tamanho
                const area = W * H;
                const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
                let scale = isMobile ? 1.5 : 2.5;
                if (area > 15000000) scale = 2;
                if (area > 30000000) scale = 1.5;
                if (area > 60000000) scale = 1;

                // 5) Captura
                const rendered = await html2canvas(document.getElementById('canvas'), {
                    scale,
                    useCORS: true,
                    backgroundColor: '#F5F3EE',
                    logging: false,
                    x: minX,
                    y: minY,
                    width: W,
                    height: H,
                });

                // 6) Monta o PDF
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: W >= H ? 'landscape' : 'portrait',
                    unit: 'px',
                    format: [W, H],
                    hotfixes: ['px_scaling']
                });

                const imgData = rendered.toDataURL('image/jpeg', 0.93);
                pdf.addImage(imgData, 'JPEG', 0, 0, W, H);

                const fname = 'fluxo-unico-contato-' + new Date().toISOString().slice(0, 10) + '.pdf';
                pdf.save(fname);

                toast('✅ PDF gerado! Confira seus downloads.');
            } catch (err) {
                console.error(err);
                toast('❌ Erro ao gerar PDF: ' + (err.message || err), 'erro');
            } finally {
                hiddenEls.forEach(([el, o]) => el.style.display = o);
                d3.select("#map-wrapper").call(zoom.transform, savedTransform);
                mapWrapper.style.overflow = origOverflow;
                btn.disabled = false;
                btn.innerHTML = orig;
            }
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        document.getElementById('btn-close-modal').addEventListener('click', () => closeModal('node-modal'));
        document.getElementById('node-modal').addEventListener('click', (e) => { if (e.target.id === 'node-modal') closeModal('node-modal'); });
        document.getElementById('cfg-modal').addEventListener('click', (e) => { if (e.target.id === 'cfg-modal') closeModal('cfg-modal'); });
        window.addEventListener('resize', drawLines);
        window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideContextMenu(); });

        loadFromGitHub();
        setTimeout(centerMap, 300);
    </script>
</body>
</html>
